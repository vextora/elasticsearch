services:
  db:
    image: postgres:15
    container_name: ecs_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata_ecs:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost",
        ]
      interval: 5s
      retries: 10
      start_period: 5s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -s http://localhost:9200/_cluster/health | grep -q ''"status":"green"''',
        ]
      interval: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

  app:
    build: .
    container_name: ecs_app
    depends_on:
      - db
      - elasticsearch
    working_dir: /app
    volumes:
      - .:/app
      - /app/tmp
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata_ecs:
